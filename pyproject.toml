[project]
name = "veridict-verify"
version = "0.2.0"
description = "Standalone offline verifier for VERIDICT case bundles. Free and open: trust, but re-check."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VERIDICT contributors" }]
keywords = [
    "osint",
    "provenance",
    "verification",
    "evidence",
    "ed25519",
    "hash-chain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=43",
    "rfc8785>=0.1.4",
]

[project.optional-dependencies]
timestamps = ["rfc3161-client>=1.0", "certifi"]

[project.urls]
Homepage = "https://github.com/CXdefense/veridict-verify"
Documentation = "https://github.com/CXdefense/veridict-verify/blob/main/docs/bundle-format.md"
Issues = "https://github.com/CXdefense/veridict-verify/issues"

[project.scripts]
veridict-verify = "veridict_verify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veridict_verify"]
